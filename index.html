<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#1F3D32">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>二人食光</title>
  <style>
    :root {
      --bg: #F5F2EE;
      --surface: #FFFFFF;
      --surface-2: #F9F7F4;
      --primary: #1F3D32;
      --primary-light: #2E5244;
      --accent: #B89B72;
      --accent-light: #D4BD96;
      --text: #1E1E1E;
      --text-secondary: #6B6B6B;
      --text-tertiary: #A8A4A0;
      --border: #EAE6E1;
      --shadow-sm: 0 2px 8px rgba(31, 41, 55, 0.04);
      --shadow: 0 8px 32px rgba(31, 41, 55, 0.06);
      --shadow-lg: 0 20px 60px rgba(31, 41, 55, 0.1);
      --radius-sm: 14px;
      --radius: 24px;
      --radius-lg: 32px;
      --transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; padding: 0; height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      background-image: radial-gradient(ellipse at 50% 0%, rgba(184, 155, 114, 0.08) 0%, transparent 60%);
      color: var(--text);
      line-height: 1.6;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    #app { min-height: 100%; display: flex; flex-direction: column; }
    .hidden { display: none !important; }
    .serif { font-family: "Noto Serif SC", "Songti SC", "STSong", Georgia, serif; }

    /* Busy progress bar */
    .busy-bar { position: fixed; top: 0; left: 0; right: 0; height: 3px; z-index: 500; overflow: hidden; opacity: 0; transition: opacity 0.25s; pointer-events: none; }
    .busy-bar.active { opacity: 1; }
    .busy-bar::after { content: ''; display: block; height: 100%; width: 40%; border-radius: 3px; background: linear-gradient(90deg, var(--accent), var(--accent-light)); animation: busySlide 1s ease-in-out infinite; }
    @keyframes busySlide { 0% { transform: translateX(-100%); } 100% { transform: translateX(350%); } }

    /* Icons */
    .icon { width: 20px; height: 20px; stroke: currentColor; stroke-width: 1.8; fill: none; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
    .icon-lg { width: 24px; height: 24px; }
    .icon-xl { width: 32px; height: 32px; }

    /* Typography */
    h1, h2, h3, h4, p { margin: 0; }
    .title-xl { font-size: 34px; font-weight: 700; letter-spacing: -0.02em; }
    .title-lg { font-size: 26px; font-weight: 700; letter-spacing: -0.01em; }
    .title-md { font-size: 20px; font-weight: 600; }
    .text-secondary { color: var(--text-secondary); }
    .text-tertiary { color: var(--text-tertiary); }
    .caption { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; }

    /* Buttons */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      border: none; border-radius: 16px; font-size: 15px; font-weight: 600;
      cursor: pointer; transition: var(--transition); padding: 14px 24px;
      white-space: nowrap; user-select: none;
    }
    .btn:disabled { opacity: 0.55; cursor: not-allowed; transform: none !important; }
    .btn-primary { background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%); color: white; box-shadow: 0 6px 18px rgba(31, 61, 50, 0.22); }
    .btn-primary:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 10px 24px rgba(31, 61, 50, 0.28); }
    .btn-primary:active:not(:disabled) { transform: translateY(0); }
    .btn-secondary { background: var(--surface); color: var(--primary); border: 1.5px solid var(--border); }
    .btn-secondary:hover:not(:disabled) { border-color: var(--accent); background: rgba(184, 155, 114, 0.04); }
    .btn-ghost { background: transparent; color: var(--text-secondary); padding: 10px 14px; }
    .btn-ghost:hover { color: var(--primary); background: rgba(31, 61, 50, 0.04); }
    .btn-block { width: 100%; }
    .btn-sm { padding: 10px 16px; font-size: 13px; border-radius: 12px; }
    .btn-xs { padding: 6px 10px; font-size: 12px; border-radius: 8px; }

    /* Cards */
    .card { background: var(--surface); border-radius: var(--radius); padding: 24px; box-shadow: var(--shadow); border: 1px solid var(--border); transition: var(--transition); }
    .card-hover:hover { transform: translateY(-3px); box-shadow: var(--shadow-lg); }

    /* Header */
    .header { position: sticky; top: 0; z-index: 100; background: rgba(245, 242, 238, 0.88); backdrop-filter: blur(16px); border-bottom: 1px solid rgba(234, 230, 225, 0.8); }
    .header-content { max-width: 840px; margin: 0 auto; padding: 16px 20px; display: flex; align-items: center; justify-content: space-between; }
    .logo { display: flex; align-items: center; gap: 10px; font-size: 18px; font-weight: 700; color: var(--primary); }
    .logo-mark { width: 34px; height: 34px; border-radius: 10px; background: var(--primary); display: flex; align-items: center; justify-content: center; color: var(--accent); box-shadow: 0 4px 10px rgba(31, 61, 50, 0.18); }
    .header-actions { display: flex; gap: 10px; align-items: center; }
    .icon-btn { width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--border); background: var(--surface); color: var(--primary); display: flex; align-items: center; justify-content: center; cursor: pointer; transition: var(--transition); flex-shrink: 0; }
    .icon-btn:hover { background: var(--primary); color: white; border-color: var(--primary); }
    .icon-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* Main */
    .main { flex: 1; max-width: 840px; width: 100%; margin: 0 auto; padding: 24px 20px 120px; }

    /* Forms */
    .form-group { margin-bottom: 20px; }
    label { display: block; font-size: 13px; font-weight: 600; color: var(--text-secondary); margin-bottom: 8px; }
    input, textarea, select { width: 100%; padding: 14px 16px; border: 1.5px solid var(--border); border-radius: var(--radius-sm); font-size: 15px; background: var(--surface); color: var(--text); transition: var(--transition); font-family: inherit; }
    input:focus, textarea:focus, select:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(31, 61, 50, 0.06); }
    textarea { min-height: 100px; resize: vertical; line-height: 1.7; }
    .help-text { font-size: 13px; color: var(--text-tertiary); margin-top: 6px; }

    /* Login */
    .login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .login-card { width: 100%; max-width: 440px; }
    .login-header { text-align: center; margin-bottom: 36px; }
    .login-mark { width: 72px; height: 72px; border-radius: 22px; background: var(--primary); display: flex; align-items: center; justify-content: center; margin: 0 auto 22px; color: var(--accent); box-shadow: var(--shadow-lg); }
    .login-title { font-size: 30px; font-weight: 700; color: var(--primary); margin-bottom: 8px; }
    .login-sub { color: var(--text-secondary); font-size: 15px; }

    /* Home */
    .hero { background: linear-gradient(135deg, var(--primary) 0%, #153025 100%); border-radius: var(--radius-lg); padding: 36px; color: white; margin-bottom: 28px; position: relative; overflow: hidden; box-shadow: var(--shadow-lg); }
    .hero::before { content: ''; position: absolute; top: -40%; right: -15%; width: 340px; height: 340px; background: radial-gradient(circle, rgba(184, 155, 114, 0.22) 0%, transparent 65%); }
    .hero::after { content: ''; position: absolute; bottom: -30%; left: -10%; width: 260px; height: 260px; background: radial-gradient(circle, rgba(255, 255, 255, 0.06) 0%, transparent 60%); }
    .hero-content { position: relative; z-index: 1; }
    .hero-greeting { font-size: 13px; opacity: 0.75; margin-bottom: 6px; letter-spacing: 0.06em; }
    .hero-title { font-size: 28px; font-weight: 700; margin-bottom: 10px; }
    .hero-title .serif { font-weight: 700; }
    .hero-stats { display: flex; gap: 28px; margin-top: 24px; }
    .hero-stat { text-align: center; }
    .hero-stat-num { font-size: 26px; font-weight: 700; color: var(--accent-light); }
    .hero-stat-label { font-size: 12px; opacity: 0.75; }

    .section-header { display: flex; align-items: flex-end; justify-content: space-between; margin-bottom: 18px; }
    .section-title-wrap { display: flex; align-items: center; gap: 10px; }
    .section-title { font-size: 18px; font-weight: 700; color: var(--primary); }
    .section-line { width: 4px; height: 20px; border-radius: 2px; background: var(--accent); }

    .quick-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 32px; }
    .quick-card { background: var(--surface); border-radius: var(--radius); padding: 18px 14px; border: 1px solid var(--border); box-shadow: var(--shadow); cursor: pointer; transition: var(--transition); text-align: left; }
    .quick-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-lg); border-color: var(--accent-light); }
    .quick-card:active { transform: translateY(0); }
    .quick-icon { width: 42px; height: 42px; border-radius: 12px; background: var(--surface-2); display: flex; align-items: center; justify-content: center; color: var(--primary); margin-bottom: 12px; transition: var(--transition); }
    .quick-card:hover .quick-icon { background: var(--primary); color: white; }
    .quick-title { font-size: 15px; font-weight: 600; margin-bottom: 3px; }
    .quick-desc { font-size: 12px; color: var(--text-tertiary); }

    /* Dishes - horizontal list */
    .search-box { position: relative; margin-bottom: 18px; }
    .search-box .icon { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--text-tertiary); }
    .search-box input { padding-left: 46px; }
    .dish-row { display: flex; align-items: center; gap: 14px; background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 12px 14px; margin-bottom: 12px; box-shadow: var(--shadow); cursor: pointer; transition: var(--transition); }
    .dish-row:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg); }
    .dish-thumb { flex-shrink: 0; width: 84px; height: 84px; border-radius: 14px; overflow: hidden; background: linear-gradient(135deg, #f0ede9 0%, #e8e4de 100%); position: relative; }
    .dish-thumb img { width: 100%; height: 100%; object-fit: cover; }
    .dish-thumb .dish-img-placeholder { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--text-tertiary); }
    .dish-row-main { flex: 1; min-width: 0; }
    .dish-name { font-size: 16px; font-weight: 600; margin-bottom: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .dish-meta { font-size: 12px; color: var(--text-tertiary); margin-bottom: 6px; }
    .dish-tags { display: flex; gap: 6px; flex-wrap: wrap; }
    .dish-tag { font-size: 11px; font-weight: 500; color: var(--primary); background: rgba(31, 61, 50, 0.06); padding: 3px 8px; border-radius: 6px; }
    .dish-add-btn { flex-shrink: 0; padding: 10px 14px; font-size: 13px; line-height: 1.3; flex-direction: column; gap: 2px; }
    .empty-state { text-align: center; padding: 70px 20px; color: var(--text-tertiary); }
    .empty-icon { width: 64px; height: 64px; margin: 0 auto 16px; color: var(--border); }

    /* Dish Detail */
    .detail-img-wrap { position: relative; border-radius: var(--radius-lg); overflow: hidden; margin-bottom: 24px; aspect-ratio: 16/10; background: linear-gradient(135deg, #f0ede9 0%, #e8e4de 100%); }
    .detail-img { width: 100%; height: 100%; object-fit: cover; }
    .detail-img-placeholder { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--text-tertiary); }
    .detail-gallery { position: absolute; bottom: 12px; left: 12px; right: 12px; display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; }
    .detail-gallery::-webkit-scrollbar { display: none; }
    .detail-gallery img { width: 56px; height: 56px; object-fit: cover; border-radius: 10px; border: 2px solid white; cursor: pointer; opacity: 0.85; transition: var(--transition); box-shadow: 0 2px 8px rgba(0,0,0,0.15); }
    .detail-gallery img:hover, .detail-gallery img.active { opacity: 1; transform: scale(1.05); }
    .detail-header { margin-bottom: 22px; }
    .detail-title { font-size: 30px; font-weight: 700; color: var(--primary); margin-bottom: 12px; }
    .detail-tags { display: flex; gap: 8px; flex-wrap: wrap; }
    .detail-tag { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text-secondary); background: var(--surface); border: 1px solid var(--border); padding: 6px 12px; border-radius: 20px; }
    .kcal-tag { color: #B45A2D; border-color: rgba(180, 90, 45, 0.25); background: rgba(180, 90, 45, 0.05); font-weight: 600; }

    .info-card { margin-bottom: 16px; }
    .info-card-title { font-size: 14px; font-weight: 700; color: var(--primary); margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
    .info-card-title .line { flex: 1; height: 1px; background: var(--border); }
    .ingredient-item { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--border); }
    .ingredient-item:last-child { border-bottom: none; }
    .ingredient-item input[type="checkbox"] { width: 20px; height: 20px; accent-color: var(--primary); cursor: pointer; }
    .ingredient-item span { font-size: 15px; color: var(--text); }
    .ingredient-item.checked span { text-decoration: line-through; color: var(--text-tertiary); }
    .step-item { display: flex; gap: 16px; margin-bottom: 18px; }
    .step-num { flex-shrink: 0; width: 32px; height: 32px; border-radius: 50%; background: var(--primary); color: white; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; }
    .step-text { flex: 1; padding-top: 5px; font-size: 15px; color: var(--text); line-height: 1.7; }
    .detail-actions { display: flex; gap: 10px; margin-top: 28px; flex-wrap: wrap; }

    /* Menu */
    .menu-date-nav { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
    .menu-date-label { flex: 1; text-align: center; font-size: 16px; font-weight: 700; color: var(--primary); }
    .menu-toolbar { display: flex; gap: 10px; margin-bottom: 20px; }
    .menu-toolbar .btn { flex: 1; }
    .meal-card { margin-bottom: 16px; }
    .meal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; gap: 8px; }
    .meal-title { display: flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 700; color: var(--primary); min-width: 0; }
    .meal-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); flex-shrink: 0; }
    .meal-actions { display: flex; gap: 6px; flex-shrink: 0; }
    .menu-items { display: flex; flex-wrap: wrap; gap: 8px; }
    .menu-chip { display: inline-flex; align-items: center; gap: 6px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 20px; padding: 8px 12px; font-size: 14px; color: var(--text); }
    .menu-chip button { width: 18px; height: 18px; border-radius: 50%; border: none; background: transparent; color: var(--text-tertiary); cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0; transition: var(--transition); }
    .menu-chip button:hover { background: var(--border); color: var(--text); }
    .menu-chip svg { width: 12px; height: 12px; }

    /* Calories result */
    .kcal-total { text-align: center; padding: 8px 0 18px; border-bottom: 1px solid var(--border); margin-bottom: 16px; }
    .kcal-total-num { font-size: 38px; font-weight: 700; color: #B45A2D; }
    .kcal-meal { margin-bottom: 14px; }
    .kcal-meal-title { font-size: 13px; font-weight: 700; color: var(--primary); margin-bottom: 6px; }
    .kcal-row { display: flex; justify-content: space-between; font-size: 14px; color: var(--text-secondary); padding: 3px 0; }
    .kcal-sub { text-align: right; font-size: 13px; font-weight: 600; color: var(--text); padding-top: 4px; }

    /* Dish picker in add-item modal */
    .picker-search { margin-bottom: 12px; }
    .picker-list { max-height: 260px; overflow-y: auto; display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
    .picker-chip { background: var(--surface-2); border: 1.5px solid var(--border); border-radius: 20px; padding: 8px 14px; font-size: 14px; cursor: pointer; transition: var(--transition); }
    .picker-chip:hover { border-color: var(--primary); background: rgba(31, 61, 50, 0.05); }
    .picker-divider { display: flex; align-items: center; gap: 10px; color: var(--text-tertiary); font-size: 12px; margin: 4px 0 14px; }
    .picker-divider::before, .picker-divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }
    .manual-add-row { display: flex; gap: 10px; }
    .manual-add-row input { flex: 1; }

    /* Vote */
    .vote-card { margin-bottom: 16px; }
    .vote-header { font-size: 16px; font-weight: 600; margin-bottom: 16px; color: var(--primary); }
    .vote-options { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .vote-option { background: var(--surface-2); border: 1.5px solid var(--border); border-radius: var(--radius-sm); padding: 18px; text-align: center; cursor: pointer; transition: var(--transition); }
    .vote-option:hover { border-color: var(--accent); background: rgba(184, 155, 114, 0.04); }
    .vote-option-name { font-size: 16px; font-weight: 600; color: var(--primary); margin-bottom: 4px; }
    .vote-option-count { font-size: 12px; color: var(--text-tertiary); }
    .vote-bar-wrap { height: 6px; background: var(--border); border-radius: 3px; margin-top: 14px; overflow: hidden; }
    .vote-bar { height: 100%; background: linear-gradient(90deg, var(--accent) 0%, var(--accent-light) 100%); transition: width 0.4s ease; }

    /* Modal */
    .modal-overlay { position: fixed; inset: 0; background: rgba(31, 41, 55, 0.35); backdrop-filter: blur(6px); z-index: 200; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .modal { background: var(--surface); width: 100%; max-width: 560px; max-height: 90vh; border-radius: var(--radius-lg); padding: 28px; overflow-y: auto; box-shadow: var(--shadow-lg); animation: fadeScale 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
    @keyframes fadeScale { from { transform: scale(0.96); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
    .modal-title { font-size: 20px; font-weight: 700; color: var(--primary); }
    .close-btn { width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface); color: var(--text-secondary); cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .close-btn:hover { background: var(--bg); }
    .label-with-action { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
    .label-with-action label { margin-bottom: 0; }

    /* Image upload */
    .image-upload { border: 2px dashed var(--border); border-radius: var(--radius-sm); padding: 18px; text-align: center; transition: var(--transition); }
    .image-upload:hover { border-color: var(--accent-light); background: rgba(184, 155, 114, 0.02); }
    .image-upload input { display: none; }
    .upload-trigger { color: var(--primary); font-weight: 600; cursor: pointer; }
    .upload-hint { font-size: 12px; color: var(--text-tertiary); margin-top: 6px; }
    .thumb-list { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
    .thumb { position: relative; width: 80px; height: 80px; border-radius: 12px; overflow: hidden; border: 1px solid var(--border); }
    .thumb img { width: 100%; height: 100%; object-fit: cover; }
    .thumb .remove { position: absolute; top: 4px; right: 4px; width: 20px; height: 20px; border-radius: 50%; background: rgba(0,0,0,0.5); color: white; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0; }
    .thumb .remove svg { width: 12px; height: 12px; }

    /* Toast */
    .toast { position: fixed; bottom: 96px; left: 50%; transform: translateX(-50%) translateY(20px); background: var(--primary); color: white; padding: 12px 22px; border-radius: 12px; font-size: 14px; font-weight: 500; z-index: 300; opacity: 0; transition: all 0.3s ease; pointer-events: none; box-shadow: var(--shadow-lg); max-width: 86vw; text-align: center; }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .toast.error { background: #A4442E; }

    /* Bottom Nav */
    .bottom-nav { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); z-index: 100; background: rgba(255, 255, 255, 0.92); backdrop-filter: blur(14px); border: 1px solid rgba(234, 230, 225, 0.9); border-radius: 28px; padding: 8px 12px; box-shadow: var(--shadow-lg); }
    .bottom-nav-content { display: flex; gap: 4px; }
    .nav-item { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 8px 18px; cursor: pointer; color: var(--text-tertiary); transition: var(--transition); border: none; background: transparent; font-family: inherit; font-size: 10px; font-weight: 600; border-radius: 18px; }
    .nav-item .icon { transition: var(--transition); }
    .nav-item.active { color: var(--primary); background: rgba(31, 61, 50, 0.06); }
    .nav-item.active .icon { stroke-width: 2.2; }
    .nav-item:hover { color: var(--primary); }

    .view { display: none; animation: fadeIn 0.3s ease; }
    .view.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

    .loading { text-align: center; padding: 90px 20px; color: var(--text-tertiary); }
    .spinner { width: 28px; height: 28px; border: 2.5px solid var(--border); border-top-color: var(--primary); border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 12px; }
    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 480px) {
      .title-xl { font-size: 28px; }
      .hero { padding: 28px; }
      .hero-title { font-size: 24px; }
      .dish-thumb { width: 72px; height: 72px; }
      .dish-add-btn { padding: 9px 12px; font-size: 12px; }
      .quick-grid { gap: 10px; }
      .quick-card { padding: 16px 12px; }
      .modal { padding: 22px; }
      .hero-stats { gap: 22px; }
    }
  </style>
</head>
<body>
  <div id="busy-bar" class="busy-bar"></div>
  <div id="app"></div>

  <script>
    // ================== State ==================
    const state = {
      token: localStorage.getItem('gh_token') || '',
      repo: localStorage.getItem('gh_repo') || 'zzkzzk/our-cookbook',
      dsKey: localStorage.getItem('ds_key') || '',
      owner: '',
      repoName: '',
      dishes: [],
      menus: {},
      votes: [],
      currentView: 'home',

      loading: false,
      demo: false
    };

    const demoData = {
      dishes: [
        {
          id: 'demo-1', name: '红烧肉', category: '荤菜', time: '60 分钟', tags: ['下饭', '经典'],

          ingredients: '鸡翅 8个\n可乐 1罐\n生抽 2勺\n老抽 半勺\n姜片 3片',

    // Icons SVG
    const icons = {
      home: '<path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/>',

      plus: '<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>',
      settings: '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>',
      search: '<circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/>',

      trash: '<polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>',
      clock: '<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>',
      tag: '<path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l6.59 6.59a2 2 0 0 1 0 2.82z"/>',
      chef: '<path d="M6 13v7a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2v-7"/><path d="M12 3a4 4 0 0 0-4 4v6h8V7a4 4 0 0 0-4-4z"/>',
      arrowLeft: '<line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/>',
      heart: '<path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>',
      check: '<polyline points="20 6 9 17 4 12"/>',
      utensils: '<path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/><path d="M7 2v20"/><path d="M21 2v20"/><path d="M17 2v7c0 1.1.9 2 2 2h0a2 2 0 0 0 2-2V2"/>',
      close: '<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>',
      camera: '<path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/>',
      flame: '<path d="M12 22c4.4 0 7-2.8 7-6.5 0-2.6-1.4-4.9-3-6.5-.3 1.1-1 2-2 2.5C14 8 13 4.5 9.5 2c.3 2.5-.5 4.5-2 6C6 9.5 5 11.4 5 13.5 5 19.2 7.6 22 12 22z"/>',
      chevronLeft: '<polyline points="15 18 9 12 15 6"/>',
      chevronRight: '<polyline points="9 18 15 12 9 6"/>',
      sparkles: '<path d="M12 3l1.9 5.8a2 2 0 0 0 1.3 1.3L21 12l-5.8 1.9a2 2 0 0 0-1.3 1.3L12 21l-1.9-5.8a2 2 0 0 0-1.3-1.3L3 12l5.8-1.9a2 2 0 0 0 1.3-1.3L12 3z"/>'
    };

    function icon(name, cls = '') {
      return `<svg class="icon ${cls}" viewBox="0 0 24 24" aria-hidden="true">${icons[name] || ''}</svg>`;
    }

    // ================== Helpers ==================
    function $(sel) { return document.querySelector(sel); }
    function esc(str) { const div = document.createElement('div'); div.textContent = str == null ? '' : String(str); return div.innerHTML; }
    function genId() { return Date.now().toString(36) + Math.random().toString(36).substr(2, 5); }
    function pad2(n) { return String(n).padStart(2, '0'); }
    function todayKey() { const d = new Date(); return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
    function parseDateKey(key) { const p = key.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
    function dateWithOffset(key, offset) { const d = parseDateKey(key); d.setDate(d.getDate() + offset); return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
    function dateLabel(key) { const w = ['周日', '周一', '周二', '周三', '周四', '周五', '周六']; return key + ' ' + w[parseDateKey(key).getDay()]; }
    function dayName() { const d = new Date(); return (d.getMonth() + 1) + '月' + d.getDate() + '日'; }
    function greeting() { const h = new Date().getHours(); return h < 11 ? 'Good morning' : h < 17 ? 'Good afternoon' : 'Good evening'; }
    function dishImage(d) { return (d.images && d.images[0]) || d.image || ''; }

    function toast(msg, type) {
      const t = document.createElement('div');
      t.className = 'toast' + (type === 'error' ? ' error' : '');
      t.textContent = msg;
      document.body.appendChild(t);
      requestAnimationFrame(() => t.classList.add('show'));
      setTimeout(() => { t.classList.remove('show'); setTimeout(() => t.remove(), 300); }, type === 'error' ? 3200 : 2400);
    }

    let busyCount = 0;
    function setBusy(on) {
      busyCount = Math.max(0, busyCount + (on ? 1 : -1));
      const bar = document.getElementById('busy-bar');
      if (bar) bar.classList.toggle('active', busyCount > 0);
    }

    function showLoading(show) {
      state.loading = show;
      const app = $('#app');
      if (show && app.innerHTML.trim() === '') {
        app.innerHTML = '<div class="loading"><div class="spinner"></div><p>正在连接小厨房...</p></div>';
      }
    }

    function getCalCache() { try { return JSON.parse(localStorage.getItem('cal_cache') || '{}'); } catch (e) { return {}; } }
    function setCalCache(c) { localStorage.setItem('cal_cache', JSON.stringify(c)); }

    function openPrompt({ title, message, defaultValue = '', placeholder = '', onConfirm }) {
      const modal = $('#modal');
      modal.innerHTML = `
        <div class="modal-overlay" onclick="if(event.target===this)closeModal()">
          <div class="modal" style="max-width:420px;">
            <div class="modal-header">
              <h3 class="modal-title">${esc(title)}</h3>
              <button class="close-btn" onclick="closeModal()">${icon('close')}</button>
            </div>
            ${message ? `<p class="help-text" style="margin-bottom:12px;color:var(--text-secondary);">${esc(message)}</p>` : ''}
            <div class="form-group" style="margin-bottom:24px;">
              <input type="text" id="prompt-input" placeholder="${esc(placeholder)}" value="${esc(defaultValue)}">
            </div>
            <div style="display:flex;gap:12px;">
              <button class="btn btn-ghost btn-block" onclick="closeModal()">取消</button>
              <button class="btn btn-primary btn-block" id="prompt-confirm">确定</button>
            </div>
          </div>
        </div>
      `;
      $('#prompt-input').focus();
      $('#prompt-input').addEventListener('keydown', e => { if (e.key === 'Enter') $('#prompt-confirm').click(); });
      $('#prompt-confirm').onclick = () => {
        const val = $('#prompt-input').value.trim();
        closeModal();
        onConfirm(val);
      };
    }

    // ================== GitHub API ==================
    let repoMeta = null;
    let treeCache = null;

    function parseRepo() {
      const parts = state.repo.split('/');
      state.owner = parts[0] || '';
      state.repoName = parts.slice(1).join('/') || '';
    }

    async function ghApi(path, options = {}) {
      setBusy(true);
      try {
        const url = `https://api.github.com${path}`;
        const res = await fetch(url, {
          headers: {
            'Authorization': `token ${state.token}`,
            'Accept': 'application/vnd.github.v3+json',
            'Content-Type': 'application/json'
          },
          ...options
        });
        if (!res.ok) {
          const errBody = await res.json().catch(() => ({}));
          const err = new Error(errBody.message || `HTTP ${res.status}`);
          err.status = res.status;
          throw err;
        }
        return res.status === 204 ? null : await res.json();
      } finally {
        setBusy(false);
      }
    }

    async function getBranch() {
      if (!repoMeta) repoMeta = await ghApi(`/repos/${state.owner}/${state.repoName}`);
      return repoMeta.default_branch || 'main';
    }

    async function getTree(force) {
      if (force) treeCache = null;
      if (!treeCache) {
        const branch = await getBranch();
        treeCache = await ghApi(`/repos/${state.owner}/${state.repoName}/git/trees/${branch}?recursive=1`);
      }
      return treeCache;
    }

    async function getFile(path) {
      const tree = await getTree();
      const entry = (tree.tree || []).find(t => t.path === path);
      if (!entry || entry.type !== 'blob') return { content: null, sha: null };
      const blob = await ghApi(`/repos/${state.owner}/${state.repoName}/git/blobs/${entry.sha}`);
      const text = decodeURIComponent(escape(atob(blob.content)));
      return { content: JSON.parse(text), sha: entry.sha };
    }

    async function saveFile(path, content, sha) {
      const body = {
        message: `update ${path}`,
        content: btoa(unescape(encodeURIComponent(JSON.stringify(content, null, 2))))
      };
      if (sha) body.sha = sha;
      const r = await ghApi(`/repos/${state.owner}/${state.repoName}/contents/${path}`, {
        method: 'PUT',
        body: JSON.stringify(body)
      });
      treeCache = null;
      return r;
    }

    async function saveFileRaw(path, base64Content) {
      const body = { message: `upload ${path}`, content: base64Content };
      const r = await ghApi(`/repos/${state.owner}/${state.repoName}/contents/${path}`, {
        method: 'PUT',
        body: JSON.stringify(body)
      });
      treeCache = null;
      return r;
    }

    async function uploadDishImages(dataUrls, dishId) {
      if (state.demo) return dataUrls.slice();
      const out = [];
      for (let i = 0; i < dataUrls.length; i++) {
        const u = dataUrls[i];
        if (u.indexOf('data:') === 0) {
          const path = `data/images/${dishId}-${i + 1}.jpg`;
          await saveFileRaw(path, u.split(',')[1]);
          out.push(path);
        } else {
          out.push(u);
        }
      }
      return out;
    }

    async function loadData() {
      parseRepo();
      showLoading(true);
      try {
        const dishes = await getFile('data/dishes.json');
        state.dishes = dishes.content === null ? [] : dishes.content;
        const menus = await getFile('data/menus.json');
        state.menus = menus.content === null ? {} : menus.content;
        const votes = await getFile('data/votes.json');
        state.votes = votes.content === null ? [] : votes.content;
        if (dishes.content === null) await saveFile('data/dishes.json', []);
        if (menus.content === null) await saveFile('data/menus.json', {});
        if (votes.content === null) await saveFile('data/votes.json', []);
        state.menuDate = todayKey();
        renderApp();
        toast('数据加载成功');
      } catch (e) {
        alert('加载失败：' + e.message + '\n请检查 Token 和仓库名是否正确。');
        state.token = '';
        state.repo = '';
        localStorage.removeItem('gh_token');
        localStorage.removeItem('gh_repo');
        renderApp();
      } finally {
        showLoading(false);
      }
    }

    async function saveDishes() {
      if (state.demo) return;
      const { sha } = await getFile('data/dishes.json');
      await saveFile('data/dishes.json', state.dishes, sha);
    }
    async function saveMenus() {
      if (state.demo) return;
      const { sha } = await getFile('data/menus.json');
      await saveFile('data/menus.json', state.menus, sha);
    }
    async function saveVotes() {
      if (state.demo) return;
      const { sha } = await getFile('data/votes.json');
      await saveFile('data/votes.json', state.votes, sha);
    }

    // ================== DeepSeek API ==================
    async function dsChat(systemPrompt, userPrompt) {
      if (!state.dsKey) throw new Error('请先在「设置」中填写 DeepSeek API Key');
      setBusy(true);
      try {
        const res = await fetch('https://api.deepseek.com/chat/completions', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + state.dsKey },
          body: JSON.stringify({
            model: 'deepseek-chat',
            messages: [
              { role: 'system', content: systemPrompt },
              { role: 'user', content: userPrompt }
            ],
            temperature: 0.2
          })
        });
        if (!res.ok) {
          const t = await res.text().catch(() => '');
          throw new Error('DeepSeek 请求失败（' + res.status + '），请检查 API Key 是否有效');
        }
        const data = await res.json();
        return (data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content || '').trim();
      } finally {
        setBusy(false);
      }
    }

    function extractNumber(text) {
      const m = String(text).replace(/,/g, '').match(/\d+(\.\d+)?/);
      return m ? Math.round(parseFloat(m[0])) : null;
    }

    // ================== Views ==================
    function renderApp() {
      if (!state.demo && (!state.token || !state.repo)) {
        renderLogin();
        return;
      }
      $('#app').innerHTML = `
        <header class="header">
          <div class="header-content">
            <div class="logo">
              <div class="logo-mark">${icon('utensils')}</div>
              <span class="serif">二人食光</span>
            </div>
            <div class="header-actions">
              <button class="icon-btn" onclick="showModal('addDish')" title="添加菜品">${icon('plus')}</button>
              <button class="icon-btn" onclick="showSettings()" title="设置">${icon('settings')}</button>
            </div>
          </div>
        </header>
        <main class="main">
          <div id="view-home" class="view ${state.currentView === 'home' ? 'active' : ''}"></div>
          <div id="view-dishes" class="view ${state.currentView === 'dishes' ? 'active' : ''}"></div>
          <div id="view-menu" class="view ${state.currentView === 'menu' ? 'active' : ''}"></div>
          <div id="view-votes" class="view ${state.currentView === 'votes' ? 'active' : ''}"></div>
        </main>
        <nav class="bottom-nav">
          <div class="bottom-nav-content">
            <button class="nav-item ${state.currentView === 'home' ? 'active' : ''}" onclick="nav('home')">${icon('home')}<span>首页</span></button>
            <button class="nav-item ${state.currentView === 'dishes' ? 'active' : ''}" onclick="nav('dishes')">${icon('book')}<span>菜谱</span></button>
            <button class="nav-item ${state.currentView === 'menu' ? 'active' : ''}" onclick="nav('menu')">${icon('menu')}<span>菜单</span></button>
            <button class="nav-item ${state.currentView === 'votes' ? 'active' : ''}" onclick="nav('votes')">${icon('vote')}<span>投票</span></button>
          </div>
        </nav>
        <div id="modal"></div>
      `;
      renderHome();
      renderDishes();
      renderMenu();
      renderVotes();
    }

    function renderLogin() {
      $('#app').innerHTML = `
        <div class="login-wrap">
          <div class="card login-card">
            <div class="login-header">
              <div class="login-mark">${icon('utensils', 'icon-xl')}</div>
              <h1 class="login-title serif">二人食光</h1>
              <p class="login-sub">我们的私房菜谱与互动点菜小站</p>
            </div>
            <div class="form-group">
              <label>GitHub Token</label>
              <input type="password" id="token" placeholder="ghp_xxxxxxxxxxxx" value="${esc(state.token)}">
              <div class="help-text">用于读写仓库数据，仅保存在本地浏览器。</div>
            </div>
            <div class="form-group">
              <label>仓库名</label>
              <input type="text" id="repo" placeholder="用户名/仓库名" value="${esc(state.repo || 'zzkzzk/our-cookbook')}">
            </div>
            <div class="form-group">
              <label>DeepSeek API Key（可选，用于 AI 整理菜谱和热量分析）</label>
              <input type="password" id="dskey" placeholder="sk-xxxxxxxxxxxx" value="${esc(state.dsKey)}">
            </div>
            <button class="btn btn-primary btn-block" onclick="doLogin()">进入小厨房</button>
            <button class="btn btn-secondary btn-block" style="margin-top: 12px;" onclick="startDemo()">本地试用</button>
            <p class="help-text" style="text-align: center; margin-top: 20px;">
              还没有 Token？<a href="https://github.com/settings/tokens/new?scopes=repo&description=二人食光" target="_blank" style="color: var(--primary); font-weight: 600;">点击这里生成</a>（勾选 repo 权限）
            </p>
          </div>
        </div>
      `;
    }

    function doLogin() {
      state.token = $('#token').value.trim();
      state.repo = $('#repo').value.trim();
      state.dsKey = $('#dskey').value.trim();
      if (!state.token || !state.repo) return alert('请填写 Token 和仓库名');
      localStorage.setItem('gh_token', state.token);
      localStorage.setItem('gh_repo', state.repo);
      localStorage.setItem('ds_key', state.dsKey);
      loadData();
    }

    function showSettings() {
      const modal = $('#modal');
      modal.innerHTML = `
        <div class="modal-overlay" onclick="if(event.target===this)closeModal()">
          <div class="modal" style="max-width:440px;">
            <div class="modal-header">
              <h3 class="modal-title">设置</h3>
              <button class="close-btn" onclick="closeModal()">${icon('close')}</button>
            </div>
            <div class="form-group">
              <label>GitHub Token</label>
              <input type="password" id="s-token" value="${esc(state.token)}">
              <div class="help-text">可随时修改，仅保存在当前浏览器。</div>
            </div>
            <div class="form-group">
              <label>仓库名</label>
              <input type="text" id="s-repo" value="${esc(state.repo)}">
            </div>
            <div class="form-group">
              <label>DeepSeek API Key</label>
              <input type="password" id="s-dskey" value="${esc(state.dsKey)}" placeholder="sk-xxxxxxxxxxxx">

    async function previewImages(input) {
      const files = Array.from(input.files || []);
      if (!files.length) return;
      toast('正在处理图片...');
      for (const file of files) {
        try { pendingImages.push(await resizeImage(file)); } catch (e) { console.error(e); }
      }
      renderThumbs();
    }

    function renderThumbs() {
      const box = $('#d-thumbs');
      if (!box) return;
      box.innerHTML = pendingImages.map((src, i) => `
        <div class="thumb">
          <img src="${src}" alt="">
          <button class="remove" onclick="removePendingImage(${i})" title="移除">${icon('close')}</button>
        </div>
      `).join('');
    }

    function removePendingImage(i) { pendingImages.splice(i, 1); renderThumbs(); }

    function resizeImage(file, maxWidth = 1080, quality = 0.72) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        const reader = new FileReader();
        reader.onload = e => { img.src = e.target.result; };
        img.onload = () => {
          const canvas = document.createElement('canvas');
          const scale = Math.min(1, maxWidth / Math.max(img.width, img.height));
          canvas.width = Math.round(img.width * scale);
          canvas.height = Math.round(img.height * scale);
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          resolve(canvas.toDataURL('image/jpeg', quality));
        };
        img.onerror = reject;
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    async function aiOrganizeSteps(btn) {
      const name = $('#d-name').value.trim();
      const steps = $('#d-steps').value.trim();
      if (!steps) return alert('请先输入制作流程，再让 AI 整理');
      const original = btn ? btn.innerHTML : '';
      if (btn) { btn.disabled = true; btn.innerHTML = '整理中...'; }
      try {
        const res = await dsChat(
          '你是菜谱编辑助手。把用户输入的菜谱制作流程整理成清晰、简洁的步骤说明。要求：每行一个步骤，不要加序号，不要输出任何与步骤无关的内容。',
          '菜名：' + (name || '未命名') + '\n制作流程：\n' + steps
        );
        if (res) {
          $('#d-steps').value = res.split('\n').map(s => s.trim()).filter(Boolean).join('\n');
          toast('已整理完成');
        } else {
          toast('AI 返回为空，请重试', 'error');

        toast(e.message, 'error');
      } finally {
        if (btn) { btn.disabled = false; btn.innerHTML = original; }
      }
    }

      const dish = state.dishes.find(d => d.id === id);

      const original = btn ? btn.innerHTML : '';

          '你是专业营养师。根据菜名、食材和做法，估算这道菜正常成年人一人份的热量。只返回 JSON 对象，格式：{"kcal": 数值}，不要输出其他内容。',

        );

        showDishDetail(id);

      }

    }

    function goToday() {
      state.menuDate = todayKey();
      renderMenu();
    }

    function renderMealCard(meal, date) {
      const items = meal.items || [];
      return `
        <div class="card meal-card">
          <div class="meal-header">
            <div class="meal-title"><span class="meal-dot"></span>${esc(meal.name)}</div>
            <div class="meal-actions">
              <button class="btn btn-ghost btn-xs" onclick="renameMeal('${meal.id}')">重命名</button>
              <button class="btn btn-secondary btn-xs" onclick="showAddItemModal('${meal.id}')">${icon('plus')} 添加</button>
              <button class="btn btn-ghost btn-xs" onclick="deleteMeal('${meal.id}')">${icon('trash')}</button>
            </div>
          </div>
          ${items.length === 0 ? '<p class="help-text" style="margin: 0;">未安排</p>' : `
            <div class="menu-items">
              ${items.map(d => `
                <div class="menu-chip">
                  <span>${esc(d)}</span>
                  <button onclick="removeFromMenu('${meal.id}', '${esc(d).replace(/'/g, "\\'")}')">${icon('close')}</button>
                </div>
              `).join('')}
            </div>
          `}
        </div>
      `;
    }

    function addMeal() {
      openPrompt({
        title: '新建一餐',
        placeholder: '例如：早餐、晚餐、夜宵…',
        defaultValue: '晚餐',
        onConfirm: name => {
          if (!name) return;
          const date = state.menuDate;
          state.menus[date] = state.menus[date] || [];
          state.menus[date].push({ id: genId(), name, items: [] });
          renderMenu();
          toast('已新建「' + name + '」');
          saveMenus().catch(e => alert('保存失败：' + e.message));
        }
      });
    }

    function renameMeal(mealId) {
      const date = state.menuDate;
      const meals = state.menus[date] || [];
      const meal = meals.find(m => m.id === mealId);
      if (!meal) return;
      openPrompt({
        title: '重命名',
        defaultValue: meal.name,
        onConfirm: name => {
          if (!name) return;
          meal.name = name;
          renderMenu();
          toast('已重命名');
          saveMenus().catch(e => alert('保存失败：' + e.message));
        }
      });
    }

    function deleteMeal(mealId) {
      if (!confirm('确定删除这一餐？')) return;
      const date = state.menuDate;
      state.menus[date] = (state.menus[date] || []).filter(m => m.id !== mealId);
      renderMenu();
      toast('已删除');
      saveMenus().catch(e => alert('保存失败：' + e.message));
    }

    function showAddItemModal(mealId) {
      const date = state.menuDate;
      const meals = state.menus[date] || [];
      const meal = meals.find(m => m.id === mealId);
      if (!meal) return;
      const modal = $('#modal');
      modal.innerHTML = `
        <div class="modal-overlay" onclick="if(event.target===this)closeModal()">
          <div class="modal">
            <div class="modal-header">
              <h3 class="modal-title">添加到「${esc(meal.name)}」</h3>
              <button class="close-btn" onclick="closeModal()">${icon('close')}</button>
            </div>
            <div class="picker-search">
              <input type="text" id="picker-kw" placeholder="搜索菜谱..." oninput="renderPickerList('${mealId}')">
            </div>
            <div class="picker-list" id="picker-list"></div>
            <div class="picker-divider">手动输入</div>
            <div class="manual-add-row">
              <input type="text" id="manual-name" placeholder="输入菜名，例如：红烧肉">
              <button class="btn btn-primary btn-sm" onclick="addManualItem('${mealId}')">添加</button>
            </div>
          </div>
        </div>
      `;
      renderPickerList(mealId);
    }

    function renderPickerList(mealId) {
      const date = state.menuDate;
      const meals = state.menus[date] || [];
      const meal = meals.find(m => m.id === mealId);
      const box = $('#picker-list');
      if (!box || !meal) return;
      const kw = ($('#picker-kw')?.value || '').toLowerCase();
      const list = state.dishes.filter(d => d.name.toLowerCase().includes(kw));
      if (!list.length) {
        box.innerHTML = '<p class="help-text" style="margin:0;">没有匹配的菜谱</p>';
        return;
      }
      box.innerHTML = list.map(d => `
        <div class="picker-chip" onclick="addDishToMeal('${mealId}', '${esc(d.name).replace(/'/g, "\\'")}')">${esc(d.name)}</div>
      `).join('');
    }

    function addDishToMeal(mealId, dishName) {
      const date = state.menuDate;
      const meals = state.menus[date] || [];
      const meal = meals.find(m => m.id === mealId);
      if (!meal) return;
      if (!meal.items.includes(dishName)) meal.items.push(dishName);
      renderMenu();
      toast('已加入「' + meal.name + '」');
      saveMenus().catch(e => alert('保存失败：' + e.message));
      const kw = $('#picker-kw');
      if (kw) { kw.value = ''; renderPickerList(mealId); }
    }

    function addManualItem(mealId) {
      const name = $('#manual-name').value.trim();
      if (!name) return;
      addDishToMeal(mealId, name);
      $('#manual-name').value = '';
    }

    // One-tap add from dish cards / detail: create (or reuse) today's day-named meal
    function quickAddToMenu(dishId, btn) {
      const dish = state.dishes.find(d => d.id === dishId);
      if (!dish) return;
      const today = todayKey();
      const mealName = dayName();
      state.menus[today] = state.menus[today] || [];
      let meal = state.menus[today].find(m => m.name === mealName);
      if (!meal) {
        meal = { id: genId(), name: mealName, items: [] };
        state.menus[today].push(meal);
      }
      if (meal.items.includes(dish.name)) {
        toast('「' + dish.name + '」已在今日菜单中');
        return;
      }
      meal.items.push(dish.name);
      if (btn) {
        const original = btn.innerHTML;
        btn.disabled = true;
        btn.innerHTML = '已加入';
        setTimeout(() => { btn.disabled = false; btn.innerHTML = original; }, 1200);
      }
      toast('已加入「' + mealName + '」');
      saveMenus().catch(e => alert('保存失败：' + e.message));
    }

    function removeFromMenu(mealId, name) {
      const date = state.menuDate;
      const meals = state.menus[date] || [];
      const meal = meals.find(m => m.id === mealId);
      if (!meal) return;
      meal.items = meal.items.filter(n => n !== name);
      renderMenu();
      toast('已移除');
      saveMenus().catch(e => alert('保存失败：' + e.message));
    }

    async function calcMenuCalories(btn) {
      const date = state.menuDate;
      const meals = (state.menus[date] || []).filter(m => (m.items || []).length);
      if (!meals.length) return toast('该日期还没有菜品');
      const names = [...new Set(meals.flatMap(m => m.items))];
      const cache = getCalCache();
      const kcalOf = n => {
        const d = state.dishes.find(x => x.name === n);
        if (d && d.calories) return d.calories;
        if (cache[n]) return cache[n];
        return null;
      };
      const original = btn ? btn.innerHTML : '';
      if (btn) { btn.disabled = true; btn.innerHTML = '计算中...'; }
      try {
        const missing = names.filter(n => kcalOf(n) === null);
        if (missing.length) {
          const res = await dsChat(
            '你是专业营养师。请估算下列每道菜品正常成年人一人份的热量（千卡 kcal）。只返回 JSON 对象，键为菜名，值为数字，不要输出任何其他内容。',
            '菜品清单：' + missing.join('、')
          );
          const m = res.match(/\{[\s\S]*\}/);
          if (m) {
            try {
              const obj = JSON.parse(m[0]);
              Object.keys(obj).forEach(k => {
                const v = extractNumber(obj[k]);
                if (v !== null) cache[k] = v;
              });
              setCalCache(cache);
            } catch (parseErr) { /* ignore */ }
          }
        }
        let total = 0;
        const body = meals.map(meal => {
          let sub = 0;
          const rows = meal.items.map(n => {
            const k = kcalOf(n);
            if (k) sub += k;
            return `<div class="kcal-row"><span>${esc(n)}</span><span>${k ? '约 ' + k + ' kcal' : '未知'}</span></div>`;
          }).join('');
          total += sub;
          return `<div class="kcal-meal"><div class="kcal-meal-title">${esc(meal.name)}</div>${rows}<div class="kcal-sub">小计：约 ${sub} kcal</div></div>`;
        }).join('');
        $('#modal').innerHTML = `
          <div class="modal-overlay" onclick="if(event.target===this)closeModal()">
            <div class="modal" style="max-width:440px;">
              <div class="modal-header">
                <h3 class="modal-title">${esc(date)} 热量估算</h3>
                <button class="close-btn" onclick="closeModal()">${icon('close')}</button>
              </div>
              <div class="kcal-total">
                <div class="kcal-total-num serif">${total} kcal</div>
                <div class="help-text">全天一人份估算总热量</div>
              </div>
              ${body}
              <p class="help-text" style="margin-top:10px;">热量为 AI 估算值，仅供参考。</p>
            </div>
          </div>
        `;
      } catch (e) {
        toast(e.message, 'error');
      } finally {
        if (btn) { btn.disabled = false; btn.innerHTML = original; }
      }
    }

    function addToWishlist(id) {
      const dish = state.dishes.find(d => d.id === id);
      if (!dish) return;
      const list = JSON.parse(localStorage.getItem('wishlist') || '[]');
      if (!list.includes(dish.name)) {
        list.push(dish.name);
        localStorage.setItem('wishlist', JSON.stringify(list));
      }
      toast(`「${dish.name}」已加入想吃心愿单`);
    }

    // ================== Votes ==================
    function renderVotes() {
      $('#view-votes').innerHTML = `
        <div class="section-header">
          <div class="section-title-wrap">
            <div class="section-line"></div>
            <div class="section-title">二选一投票</div>
          </div>
          <button class="btn btn-secondary btn-sm" onclick="showModal('addVote')">${icon('plus')} 发起</button>
        </div>
        ${state.votes.length === 0 ?
          `<div class="empty-state">
            <div class="empty-icon">${icon('vote', 'icon-xl')}</div>
            <p>还没有投票</p>
            <p class="help-text">发起一个让两人一起决定</p>
          </div>` :
          state.votes.slice().reverse().map(v => `
            <div class="card vote-card">
              <div class="vote-header">${esc(v.a)} <span style="color: var(--text-tertiary); font-weight: 400;">vs</span> ${esc(v.b)}</div>
              <div class="vote-options">
                <div class="vote-option" onclick="doVote('${v.id}', 'a')">
                  <div class="vote-option-name">${esc(v.a)}</div>
                  <div class="vote-option-count">${v.aCount || 0} 票</div>
                </div>
                <div class="vote-option" onclick="doVote('${v.id}', 'b')">
                  <div class="vote-option-name">${esc(v.b)}</div>
                  <div class="vote-option-count">${v.bCount || 0} 票</div>
                </div>
              </div>
              <div class="vote-bar-wrap"><div class="vote-bar" style="width: ${votePercent(v)}%;"></div></div>
              <button class="btn btn-ghost btn-sm" style="margin-top: 12px;" onclick="deleteVote('${v.id}')">删除投票</button>
            </div>
          `).join('')
        }
      `;
    }

    function votePercent(v) {
      const total = (v.aCount || 0) + (v.bCount || 0);
      if (total === 0) return 50;
      return ((v.aCount || 0) / total * 100);
    }

    function saveVote() {
      const a = $('#v-a').value.trim();
      const b = $('#v-b').value.trim();
      if (!a || !b) return alert('请填写两个选项');
      state.votes.push({ id: genId(), a, b, aCount: 0, bCount: 0, createdAt: Date.now() });
      closeModal();
      renderVotes();
      toast('投票已发起');
      saveVotes().catch(e => alert('保存失败：' + e.message));
    }

    function doVote(id, option) {
      const v = state.votes.find(x => x.id === id);
      if (!v) return;
      v[option + 'Count'] = (v[option + 'Count'] || 0) + 1;
      renderVotes();
      toast('投票成功');
      saveVotes().catch(e => alert('保存失败：' + e.message));
    }

    function deleteVote(id) {
      if (!confirm('删除这个投票？')) return;
      state.votes = state.votes.filter(v => v.id !== id);
      renderVotes();
      toast('已删除');
      saveVotes().catch(e => alert('保存失败：' + e.message));
    }

    // ================== Init ==================
    if (state.token && state.repo) {
      loadData();
    } else {
      renderApp();
    }
  </script>
</body>
</html>
